<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Warranty Care - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f7fb;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 35px 5%;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            color: #28658f;
            font-size: 40px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #555;
            font-size: 20px;
            margin-top: 8px;
        }

        /* LOGIN AREA */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 150px);
            padding: 40px 20px;
        }

        .login-box {
            width: 500px;
            max-width: 100%;
            background: white;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .login-title {
            text-align: center;
            color: #28658f;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .login-description {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-bottom: 35px;
        }

        /* FORM */
        label {
            display: block;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #286b98;
        }

        .login-btn {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            background: #286b98;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1f557a;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 30px;
            font-size: 17px;
        }

        .register-link a {
            color: #286b98;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            WARRANTY CARE
        </div>

        <div class="subtitle">
            Manage your warranty claims
        </div>

    </header>


    <!-- LOGIN -->
    <main class="login-container">

        <div class="login-box">

            <h1 class="login-title">
                Welcome Back
            </h1>

            <p class="login-description">
                Login to manage your warranty
            </p>


            <form id="loginForm">

                <!-- EMAIL -->
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn">
                    SIGN IN
                </button>

            </form>


            <!-- MESSAGE -->
            <p id="message"></p>


            <!-- REGISTER -->
            <div class="register-link">

                New customer?

                <a href="register.html">
                    Create account
                </a>

            </div>

        </div>

    </main>


    <script>

        // LOGIN FORM
        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                const message =
                    document.getElementById("message");


                message.textContent = "Logging in...";
                message.style.color = "#286b98";


                try {

                    // Send login request to FastAPI
                    const response = await fetch(
                        "http://127.0.0.1:8000/users/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "Accept": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    // SUCCESS
                    if (response.ok) {

                        /*
                         * IMPORTANT:
                         * Save the user information.
                         * products.html needs user_id.
                         */

                        localStorage.setItem(
                            "user_id",
                            data.id
                        );

                        localStorage.setItem(
                            "username",
                            data.name
                        );

                        localStorage.setItem(
                            "email",
                            data.email
                        );


                        message.textContent =
                            "Login successful!";

                        message.style.color = "green";


                        // Open dashboard
                        setTimeout(function() {

                            window.location.href =
                                "dashboard.html";

                        }, 500);

                    }


                    // LOGIN FAILED
                    else {

                        if (Array.isArray(data.detail)) {

                            message.textContent =
                                "Invalid email or password.";

                        } else {

                            message.textContent =
                                data.detail ||
                                "Invalid email or password.";

                        }

                        message.style.color = "red";

                    }

                }


                // SERVER ERROR
                catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to connect to server.";

                    message.style.color = "red";

                }

            });

    </script>

</body>
</html>
